apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, labels: { app: alertmanager } }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/tmp]
          ports: [{ name: http, containerPort: 9093 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager }]
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager }
spec:
  selector: { app: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: http }]
