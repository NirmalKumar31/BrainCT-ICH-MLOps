# Routes by severity. The receivers are placeholders: point `webhook_configs` at Slack /
# PagerDuty / an incident bot in a real deployment. Grouped so a drift storm is one page.
route:
  receiver: default
  group_by: [alertname, feature, label]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall
receivers:
  - name: default
  - name: oncall
inhibit_rules:
  # A pod without a model makes every other alert noise.
  - source_matchers: [alertname="BrainCTModelNotLoaded"]
    target_matchers: [severity="warning"]
