apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          env:
            # Read-only anonymous viewing (the Service is ClusterIP: port-forward only). Admin
            # comes from a Secret instead of Grafana's default admin/admin:
            #   kubectl -n brainct-monitoring create secret generic grafana-admin \
            #     --from-literal=password="$(openssl rand -hex 16)"
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/brainct.json }
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml }
            - { name: datasource, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasource
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
