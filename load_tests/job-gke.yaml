apiVersion: batch/v1
kind: Job
metadata:
  name: brainct-load
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: REGISTRY/brainct-api:0.2.1
          imagePullPolicy: Always
          command: ["python", "/load/incluster.py"]
          env:
            - { name: STEPS, value: "1,2,4,8,12,16" }
            - { name: STEP_SECONDS, value: "90" }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: load, mountPath: /load }]
      volumes:
        - name: load
          configMap: { name: brainct-load }
