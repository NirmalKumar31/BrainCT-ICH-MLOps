image:
  repository: brainct-api
  # Pushed tags are immutable (Artifact Registry, infra/terraform): use <version>-<git sha>,
  # so IfNotPresent can never run a stale image under a reused tag.
  tag: "0.2.1"
  pullPolicy: IfNotPresent

replicaCount: 1

# One uvicorn process per pod; ONNX Runtime threads = CPU limit, so scale out, not up.
resources:
  requests: { cpu: "1", memory: 768Mi }
  limits: { cpu: "2", memory: 1536Mi }

env:
  BRAINCT_THREADS: "2"
  BRAINCT_MAX_CONCURRENCY: "1"
  # Series decoded at once; each can hold up to BRAINCT_MAX_TOTAL_MB (200) of slices.
  BRAINCT_MAX_DECODES: "2"
  BRAINCT_MAX_REQUEST_MB: "210"
  BRAINCT_MAX_SLICES: "256"
  BRAINCT_DRIFT_WINDOW: "2000"
  BRAINCT_LOG_LEVEL: INFO

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  # Scale down slowly: a series request is seconds of CPU, so load arrives in bursts.
  scaleDownStabilizationSeconds: 120

# maxUnavailable, not minAvailable: with a single replica, minAvailable 1 forbids every
# voluntary eviction and blocks node drains and upgrades.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# /v1/feedback writes the live quality metrics; set a Secret (key: token) to require it.
feedbackToken:
  existingSecret: ""

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the API besides its own (the monitoring namespace scrapes it).
  allowNamespaces: [brainct-monitoring]

prometheus:
  scrape: true
