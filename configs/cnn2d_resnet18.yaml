# Ablation baseline matching the reference project's input: one slice, 3 windows.
# Same backbone, schedule and sampling as the 2.5D run, so the difference is the context.
run_name: cnn2d_resnet18
backbone: resnet18
pretrained: true
context: 0
epochs: 5
batch_size: 48
lr: 6.0e-4
neg_ratio: 1.25
context_dropout: 0.0
