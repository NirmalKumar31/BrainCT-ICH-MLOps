# Deployed model. One slice, 3 windows (the reference project's input); context across slices
# comes from the series model. Same recipe as the 2.5D ablation, so only the input differs.
run_name: cnn2d_resnet18
backbone: resnet18
pretrained: true
context: 0
epochs: 5
batch_size: 48
lr: 6.0e-4
neg_ratio: 1.25
context_dropout: 0.0
