name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # No PyTorch here (multi-GB wheels): training tests skip, everything the service runs
      # is tested. `onnx` is needed by the stand-in bundle builder.
      - name: Install (serve extra + dev, from uv.lock)
        run: uv sync --locked --extra serve --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Serving requirements match uv.lock
        run: |
          uv export --frozen --no-dev --extra serve --no-emit-project --no-hashes \
            -o serving/requirements.txt > /dev/null
          git diff --exit-code serving/requirements.txt
      - name: Tests + coverage gate
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage-xml, path: coverage.xml }

  image:
    name: image · scan · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Stand-in bundle (the trained model is not distributed)
        run: pip install numpy onnx && python scripts/make_standin_bundle.py artifacts/standin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: serving/Dockerfile
          load: true
          tags: brainct-api:ci
          build-args: |
            BUNDLE=artifacts/standin
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fail on fixable high or critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: brainct-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image has no PyTorch and runs as non-root
        run: |
          docker run --rm --entrypoint python brainct-api:ci -c "import importlib.util as u, os; assert u.find_spec('torch') is None; assert os.getuid() == 10001"
          docker image inspect brainct-api:ci --format 'size={{.Size}}'
      - name: Container smoke test (read-only root fs, like the Helm chart)
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 brainct-api:ci
          pip install pydicom requests
          python scripts/smoke_test.py http://127.0.0.1:8000 --wait 60
      - if: failure()
        run: docker logs api
      # The k8s job deploys this exact image (the one scanned above), not a rebuild.
      - name: Save the scanned image
        run: docker tag brainct-api:ci brainct-api:0.2.1 && docker save brainct-api:0.2.1 -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: api-image, path: image.tar, retention-days: 1 }

  k8s:
    name: kind · helm · e2e
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install numpy pydicom requests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: api-image }
      - name: Load the scanned image
        run: docker load -i image.tar
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { cluster_name: brainct }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint chart
        run: helm lint infra/helm/brainct -f infra/helm/brainct/values-kind.yaml
      - name: Deploy
        run: |
          kind load docker-image brainct-api:0.2.1 --name brainct
          helm install brainct infra/helm/brainct -f infra/helm/brainct/values-kind.yaml --wait --timeout 5m
          kubectl get pods,svc,hpa,pdb -o wide
      - name: End-to-end through the Service
        run: |
          kubectl port-forward svc/brainct-brainct 8080:80 &
          python scripts/smoke_test.py http://127.0.0.1:8080 --wait 60
      - name: Rolling restart keeps serving (maxUnavailable 0 + readiness)
        run: |
          # Traffic from inside the cluster (a port-forward dies with its pod): /ready every
          # 0.2 s through the Service during the restart; any non-200 fails the step.
          kubectl run traffic --image=curlimages/curl:8.11.1 --restart=Never --command -- sh -c '
            ok=0; bad=0; end=$(( $(date +%s) + 75 ));
            while [ $(date +%s) -lt $end ]; do
              code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://brainct-brainct/ready);
              if [ "$code" = 200 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi; sleep 0.2;
            done; echo "ok=$ok bad=$bad"; [ $bad -eq 0 ]'
          kubectl wait pod/traffic --for=condition=Ready --timeout 60s
          sleep 5
          kubectl rollout restart deploy/brainct-brainct
          kubectl rollout status deploy/brainct-brainct --timeout 3m
          kubectl wait pod/traffic --for=jsonpath='{.status.phase}'=Succeeded --timeout 120s \
            || { kubectl logs traffic; exit 1; }
          kubectl logs traffic
      - name: Alert rules and Alertmanager config are valid
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v2.55.1 \
            check rules /m/prometheus/alerts.yml
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /m/alertmanager/alertmanager.yml
      - name: Monitoring deploys, scrapes the API and loads the rules
        run: |
          kubectl apply -k monitoring
          kubectl -n brainct-monitoring create secret generic grafana-admin \
            --from-literal=password="$(openssl rand -hex 16)"
          kubectl -n brainct-monitoring rollout status deploy/prometheus --timeout 3m
          kubectl -n brainct-monitoring port-forward deploy/prometheus 9090:9090 &
          for i in $(seq 1 30); do
            up=$(curl -s 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22brainct-pods%22%7D' \
              | python -c "import json,sys; r=json.load(sys.stdin)['data']['result']; print(sum(float(x['value'][1]) for x in r))" 2>/dev/null || echo 0)
            [ "${up%.*}" -ge 1 ] && break; sleep 5
          done
          echo "brainct targets up: $up"; [ "${up%.*}" -ge 1 ]
          curl -s http://127.0.0.1:9090/api/v1/rules | python -c "
          import json, sys
          names = {r['name'] for g in json.load(sys.stdin)['data']['groups'] for r in g['rules']}
          need = {'BrainCTServiceDown', 'BrainCTErrors', 'BrainCTModelNotLoaded', 'BrainCTInputDrift'}
          assert need <= names, need - names
          print('rules loaded:', sorted(names))"
      - if: failure()
        run: kubectl describe pods; kubectl logs -l app.kubernetes.io/name=brainct --tail 100

  terraform:
    name: terraform fmt · validate · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint
