# Actions are pinned by commit SHA and the base image by digest; Dependabot keeps the pins
# current (one weekly PR per ecosystem) so pinning does not mean never patching.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /serving
    schedule: { interval: weekly }
